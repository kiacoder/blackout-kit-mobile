name: 💡 Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas welcome! Please check existing issues (open and closed) first —
        and remember this project is a censorship-circumvention tool: think
        about how a feature behaves under DPI/traffic analysis before proposing.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way?
      placeholder: I'm trying to … but …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Alternative ideas are welcome too.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues (open and closed) for a duplicate
          required: true
