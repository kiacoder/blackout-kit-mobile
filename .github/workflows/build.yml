name: Build APK

# Build jobs are read-only apart from attestations; publication is isolated.
permissions:
  contents: read

on:
  push:
    branches: ['arena/**']
    tags:
      - 'v*'
  # Manual build. Lets you produce APKs from any commit (from the Actions tab,
  # "Run workflow") without minting a tag. APKs land in the run's Artifacts,
  # and are only attached to a Release when the run is on a tag.
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release ref
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          test "$GITHUB_REF_NAME" = "v$version"


      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          # Must be 17: android/app/build.gradle sets sourceCompatibility 17 and
          # jvmTarget "17". This was '11' and could not compile the project.
          #
          # Do NOT reintroduce `org.gradle.java.home` in android/gradle.properties:
          # that file is tracked, so any absolute path in it is evaluated on this
          # runner too. A Windows path there failed every build with
          # "Java home supplied is invalid".
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Must be >= 3.24.0. pubspec.lock pins `sdks: dart ">=3.5.0 <4.0.0"`,
          # `flutter ">=3.24.0"` because shared_preferences_android 2.3.4 (a
          # dependency_overrides entry) declares a language version above 3.4.
          # At 3.22.0 / Dart 3.4 the kernel snapshot step failed with
          # "The specified language version is too high. The highest supported
          # language version is 3.4."
          # Keep in step with the local SDK (3.24.0) and with test.yml.
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Release gate — Dart analyze + unit tests
        # A tag must not publish unless the Dart layer is clean and the unit
        # suite passes. Same policy as test.yml (--no-fatal-* keeps infos and
        # warnings non-fatal). This is the hard gate: a failure here aborts
        # the whole release, before anything is attached.
        run: |
          set -e
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Release gate — Android app unit tests
        # Covers the Android service/native lifecycle and strict WG/AWG config
        # boundary that flutter test cannot execute.
        working-directory: android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Set up Rust & Android targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, commit-pinned (CodeQL: non-immutable action)
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4

      - name: Release gate — Rust core host tests
        # The blackout-core netstack is embedded into the release APK; run
        # its host test suite (13 tests: TCP netstack round-trip, UDP relay
        # validation, packet/checksum units) before shipping it.
        run: |
          set -e
          cd native/blackout-core
          cargo test --locked

      - name: Build in-house Rust core (libblackout_core.so)
        run: |
          set -e
          cd native/blackout-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../../android/app/src/main/jniLibs build --release --locked

      - name: Set up release signing (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        # Without stable signing every CI run signs with a FRESH debug keystore —
        # hosted runners are ephemeral, so each build gets a different debug key.
        # The result is the classic update failure: installing the new APK over an
        # existing one fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE (signatures
        # do not match). Set the ANDROID_KEYSTORE_* secrets once and this step
        # writes the gitignored android/key.properties the release build reads.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          umask 077
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing release signing secret $key"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release-keystore.jks" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties
          echo "Release signing configured from secrets."

      - name: Build APKs
        # Per-ABI APKs: the Xray core (libgojni.so) is ~35 MB per ABI, so a fat
        # APK is 115.7 MB while each split lands near 64 MB / 58 MB.
        # --target-platform is required because android/app/build.gradle no
        # longer sets ndk.abiFilters (that blocks --split-per-abi entirely).
        #
        # CI is the ONLY place release APKs are produced: it holds the
        # ANDROID_KEYSTORE_* secrets. A locally built APK falls back to the
        # debug keystore, and a debug-signed build can never update a
        # release-signed one (INSTALL_FAILED_UPDATE_INCOMPATIBLE) - which is
        # how v1.12.x ended up shipping both on the same release.
        run: |
          set -e
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64
          flutter build apk --release

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release-keystore.jks"

      - name: Stage exact distribution APKs
        run: |
          set -eu
          mkdir -p dist
          label="$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then label="$GITHUB_REF_NAME"; fi
          for abi in universal arm64-v8a armeabi-v7a; do
            src="app-$abi-release.apk"
            if [[ "$abi" == universal ]]; then src=app-release.apk; fi
            cp "build/app/outputs/flutter-apk/$src" "dist/blackout-kit-$label-$abi.apk"
          done

      - name: Verify APK signatures and inventory
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -eu
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$signer" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          fi
          test -x "$signer"
          python3 tool/release_security.py --apk-dir dist --apksigner "$signer"

      - name: Install antivirus and refresh signatures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Scan exact APKs for malware
        run: |
          set -eo pipefail
          clamscan --version | tee dist/CLAMAV_VERSION.txt
          clamscan --infected --recursive --max-filesize=256M --max-scansize=512M --alert-exceeds-max=yes dist/*.apk | tee dist/CLAMAV_REPORT.txt

      - name: Generate repository dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: MobSF static analysis (optional reviewed image)
        env:
          MOBSF_IMAGE: ${{ vars.MOBSF_IMAGE }}
        run: bash tool/scan_mobsf.sh dist

      - name: VirusTotal hash reports (optional API key, no upload)
        env:
          VT_API_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.VIRUSTOTAL_API_KEY || '' }}
        run: python3 tool/virustotal_reports.py dist

      - name: Prepare security report
        run: |
          set -eu
          test -s dist/SBOM.spdx.json
          python3 tool/release_security.py --report-dir dist
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Attest APK provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.apk

      - name: Attest security evidence
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.json

      - name: Upload APK artifacts and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blackout-kit-mobile-apks
          path: dist/
          if-no-files-found: error

  build-ios:
    # Restored 2026-11-02: the iOS native layer exists (PacketTunnelProvider,
    # VpnPlatformPlugin, libbox config mode) and ios.yml proves the build
    # green on every push. This job ships the compiled app on the releases
    # page as an UNSIGNED IPA — a build deliverable, not an installable app
    # (signing is ios-release.yml's job, gated on Apple account secrets).
    runs-on: macos-15
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - name: Build Libbox.xcframework
        # The script installs sing-box's PINNED gomobile fork itself
        # (make lib_install) — installing upstream gomobile here would
        # shadow it and break the bind step.
        run: |
          chmod +x tool/build_libbox.sh
          ./tool/build_libbox.sh

      - name: Build iOS (device, no codesign)
        # DEVICE build, not simulator: mobile_scanner's GoogleMLKit pods ship
        # device-only binaries (see ios.yml for the full rationale).
        run: flutter build ios --no-codesign

      - name: Verify tunnel extension product
        run: |
          APPEX=$(find build/ios -name "BlackoutTunnel.appex" | head -1)
          test -n "$APPEX" || { echo "ERROR: BlackoutTunnel.appex was never built"; exit 1; }
          EMBEDDED=$(find build/ios -path "*Runner.app*BlackoutTunnel.appex*" | head -1)
          test -n "$EMBEDDED" || { echo "ERROR: appex exists but is not embedded in any Runner.app"; exit 1; }
          echo "BlackoutTunnel.appex built and embedded OK: $EMBEDDED"

      - name: Package unsigned IPA
        # Runner.app (+ embedded BlackoutTunnel.appex + Libbox framework)
        # zipped in the standard Payload/ layout. Unsigned by design: it is
        # the build deliverable for the releases page; a signed install IPA
        # would come from ios-release.yml once Apple account secrets exist.
        run: |
          set -e
          APP=$(find build/ios -name "Runner.app" -maxdepth 4 | head -1)
          test -n "$APP" || { echo "ERROR: Runner.app not found for packaging"; exit 1; }
          echo "packaging: $APP"
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/Runner.app
          label="$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then label="$GITHUB_REF_NAME"; fi
          (cd build/ios/ipa && zip -qry "blackout-kit-$label-ios-unsigned.ipa" Payload)
          du -h "build/ios/ipa/blackout-kit-$label-ios-unsigned.ipa"

      - name: Upload IPA artifact
        # Always, so workflow_dispatch runs still yield something downloadable.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blackout-kit-mobile-ios-ipa
          path: build/ios/ipa/blackout-kit-*-ios-unsigned.ipa
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-apk, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: blackout-kit-mobile-apks
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: blackout-kit-mobile-ios-ipa
          path: dist
      - name: Validate evidence and stage draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          (cd dist && sha256sum -c SHA256SUMS.txt)
          for apk in dist/*.apk; do
            gh attestation verify "$apk" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" --source-digest "$GITHUB_SHA"
          done
          for evidence in dist/*.json; do
            gh attestation verify "$evidence" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" --source-digest "$GITHUB_SHA"
          done
          # Refuse to overwrite any existing release. A separate human review
          # publishes the draft only after security reports and device tests.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes "Review the attached security evidence and device acceptance results before publishing. The iOS IPA is unsigned."
