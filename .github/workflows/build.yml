name: Build APK

on:
  push:
    tags:
      - 'v*'
  # Manual build. Lets you produce APKs from any commit (from the Actions tab,
  # "Run workflow") without minting a tag. APKs land in the run's Artifacts,
  # and are only attached to a Release when the run is on a tag.
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      # Needed by softprops/action-gh-release to attach the APKs.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          # Must be 17: android/app/build.gradle sets sourceCompatibility 17 and
          # jvmTarget "17". This was '11' and could not compile the project.
          #
          # Do NOT reintroduce `org.gradle.java.home` in android/gradle.properties:
          # that file is tracked, so any absolute path in it is evaluated on this
          # runner too. A Windows path there failed every build with
          # "Java home supplied is invalid".
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must be >= 3.24.0. pubspec.lock pins `sdks: dart ">=3.5.0 <4.0.0"`,
          # `flutter ">=3.24.0"` because shared_preferences_android 2.3.4 (a
          # dependency_overrides entry) declares a language version above 3.4.
          # At 3.22.0 / Dart 3.4 the kernel snapshot step failed with
          # "The specified language version is too high. The highest supported
          # language version is 3.4."
          # Keep in step with the local SDK (3.24.0) and with test.yml.
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Set up release signing (optional)
        # Without stable signing every CI run signs with a FRESH debug keystore —
        # hosted runners are ephemeral, so each build gets a different debug key.
        # The result is the classic update failure: installing the new APK over an
        # existing one fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE (signatures
        # do not match). Set the ANDROID_KEYSTORE_* secrets once and this step
        # writes the gitignored android/key.properties the release build reads.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_* secrets are not set - falling back to the debug key. Every runner mints a new debug keystore, so these APKs can never update a previously installed build (INSTALL_FAILED_UPDATE_INCOMPATIBLE)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release-keystore.jks" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties
          echo "Release signing configured from secrets."

      - name: Build APKs
        # Per-ABI APKs: the Xray core (libgojni.so) is ~35 MB per ABI, so a fat
        # APK is 115.7 MB while each split lands near 64 MB / 58 MB.
        # --target-platform is required because android/app/build.gradle no
        # longer sets ndk.abiFilters (that blocks --split-per-abi entirely).
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64

      - name: Upload APK artifacts
        # Always, so workflow_dispatch runs still yield something downloadable.
        uses: actions/upload-artifact@v4
        with:
          name: blackout-kit-mobile-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Prepare release notes and title
        id: relmeta
        # Tag pushes only: extracts THIS version's changelog section and derives the
        # title ("<tag> — <first bold bullet>") so release naming stays consistent.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf 'See CHANGELOG.md for the full history. Release %s.\n' "$TAG" > release_notes.md
          fi
          TITLE="$TAG"
          JOINED_NOTES="$(tr '\n' ' ' < release_notes.md)"
          # head -1: the joined changelog is ONE line containing many **bold**
          # items; grep -o emits every match on it, and a multi-line summary
          # breaks the GITHUB_OUTPUT file format.
          SUMMARY="$(echo "$JOINED_NOTES" | grep -m1 -oE '[-*][[:space:]]*\*\*[^*]+\*\*' | sed -E 's/^[-*][[:space:]]*\*\*([^*]+)\*\*/\1/' | head -1)"
          [ -n "$SUMMARY" ] && TITLE="$TAG — $SUMMARY"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Release notes prepared for $TAG (title: $TITLE)"

      - name: Upload APKs to Release
        # Single owner of release creation (release.yml was removed — its
        # ncipollo step raced this one and could mint a second, empty release).
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.relmeta.outputs.title }}
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The iOS job was removed on 2026-09-19. It ran `flutter build ios --release
  # --no-codesign` and uploaded ios/build/Release-iphoneos/Runner.app, but the
  # iOS native layer does not exist: ios/Runner/*.swift are unregistered mocks
  # and there is no AppDelegate.swift. The build "succeeded" and published an
  # artifact that cannot connect to anything. Restore this job once the
  # NEVPNManager / NEPacketTunnelProvider implementation lands.
