name: CodeQL

# What this covers, and what CodeQL simply cannot cover.
#
# CodeQL supports eleven languages: C/C++, C#, Go, Java, Kotlin, JavaScript,
# TypeScript, Python, Ruby, Rust, Swift, and GitHub Actions.
#
# **Dart is not one of them.** The 48 Dart files in lib/ — the actual app — are
# invisible to CodeQL no matter how this file is written. That is a hard limit
# of the tool, not a configuration choice. Dart is covered by `flutter analyze`
# and the tests in test.yml, and dependency CVEs by Dependabot.
#
# So "scan everything" here means every language that exists in this repository
# AND can be extracted:
#
#   java-kotlin  android/  — 11 Kotlin files (VpnService, engine runner, plugin)
#   swift        ios/      — 4 Swift files (AppDelegate, tunnel provider, plugin)
#   python       tool/     — 1 script
#   actions      — handled by CodeQL default setup, not here (see below)
#
# Two languages are deliberately absent, because scanning them produces an
# error row on the Security tab rather than a scan:
#
#   ruby   The only Ruby file is ios/Podfile. CodeQL's Ruby extractor does not
#          treat it as source, so the job fails with "No Ruby code found" —
#          exactly the red X this repository used to show.
#   c-cpp  There is no C or C++ source. The only matches are CMake scratch
#          files under android/app/.cxx, which are build output.
#
# Ownership: CodeQL *default setup* keeps `actions` (no build needed, and it
# keeps working even if this file is ever disabled). This workflow owns the
# compiled and scripted languages. One owner per language means no duplicate
# uploads to the same category and no duplicated configuration rows.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'tool/**'
      - 'lib/**'
      - '.github/workflows/codeql.yml'
  # Security scanning should not gate every commit. Weekly keeps every language
  # fresh, including Swift, which needs a macOS runner and a full iOS build.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that runs on Linux: cheap, so it runs on every push.
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # Required to upload results to the code scanning dashboard.
      security-events: write
      # Required by CodeQL to read workflow metadata.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # The native layer: VpnService, establishDnsOnly, EngineRunner,
          # VpnPlugin. Kotlin has no `none` build mode (Java does, Kotlin does
          # not), so CodeQL must observe a real compile.
          - language: java-kotlin
            build-mode: manual
          # One script, no build.
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@v4
        with:
          # Must match android/app/build.gradle (sourceCompatibility 17).
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: subosito/flutter-action@v2
        with:
          # Keep in step with build.yml / ios.yml / test.yml: the dependency set
          # requires Dart >= 3.5, so Flutter must be >= 3.24.0.
          flutter-version: '3.24.0'
          channel: stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality, not the bare default: this is the only static
          # analysis the native layer gets, so the extra queries are worth the
          # runtime.
          queries: security-and-quality

      - name: Build Android (Kotlin)
        if: ${{ matrix.language == 'java-kotlin' }}
        # A debug build is enough for the tracer to see every Kotlin
        # compilation unit, and it skips the release signing setup.
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  # The iOS sources. Needs a macOS runner plus the Libbox framework and a full
  # `flutter build ios` — roughly 15 minutes at 10x the minute cost of Linux.
  # Weekly and on demand only: scanning a compile-only target should not tax
  # every commit.
  #
  # A separate job rather than a matrix entry: `matrix` is not available in a
  # job-level `if`, so the push gate has to be decided without it.
  analyze-swift:
    name: Analyze swift
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 90

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Set up Go (Libbox)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build iOS (Swift)
        # Same recipe as ios.yml: the Runner target imports Libbox, which is
        # built from sing-box with the pinned gomobile fork. Without it the
        # Swift compile fails before CodeQL ever sees the sources.
        run: |
          flutter pub get
          chmod +x tool/build_libbox.sh
          ./tool/build_libbox.sh
          flutter build ios --no-codesign

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:swift'
