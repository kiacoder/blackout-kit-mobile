name: Offline configuration factory
on:
  workflow_dispatch:
  push:
    paths: ['tool/config_factory.py', 'tool/tests/**', 'tool/requirements-config.txt', '.github/workflows/config-factory.yml']
  pull_request:
    paths: ['tool/config_factory.py', 'tool/tests/**', 'tool/requirements-config.txt', '.github/workflows/config-factory.yml']
permissions:
  contents: read
jobs:
  factory-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tool/requirements-config.txt
      - run: python -m unittest discover -s tool/tests -v
