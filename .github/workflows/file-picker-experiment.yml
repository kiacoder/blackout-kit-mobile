name: File picker permission experiment
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'tool/prepare_file_picker_experiment.py'
      - '.github/workflows/file-picker-experiment.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Resolve candidate dependencies only in this checkout
        run: |
          python3 tool/prepare_file_picker_experiment.py --manifest pubspec.yaml
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build and verify merged manifest, no installation
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub --target-platform android-arm,android-arm64
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          apk=build/app/outputs/flutter-apk/app-debug.apk
          "$aapt" dump badging "$apk" | grep -F "package: name='com.blackoutkit.vpn'"
          "$aapt" dump permissions "$apk" > file-picker-permissions.txt
          if grep -Eq 'android.permission.(READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE)' file-picker-permissions.txt; then
            echo 'Unexpected broad storage permission remains in candidate APK' >&2
            exit 1
          fi
          sha256sum "$apk" > file-picker-apk-sha256.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: file-picker-permission-evidence
          path: |
            pubspec.lock
            file-picker-permissions.txt
            file-picker-apk-sha256.txt
          if-no-files-found: warn
          retention-days: 14
