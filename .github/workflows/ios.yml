name: Build iOS (no codesign)

# iOS is not yet a shippable platform (VPN entitlements need a paid Apple
# Developer account, which we do not have). This workflow is the compile
# gate: it proves the Runner app + BlackoutTunnel extension + libbox
# framework link cleanly on a real Xcode toolchain, headless, on every
# push that touches ios/ or the engine code — so the platform never rots
# while it waits for signing.

# Least privilege: this workflow checks out the repo and compiles it. It never
# writes back, so the token only needs read access. Without an explicit block
# GitHub applies the repository default, which for older repos is read/write —
# CodeQL reports that as actions/missing-workflow-permissions.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - '.github/workflows/ios.yml'
      - 'tool/build_libbox.sh'
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin to the version the repo is developed against (pubspec.lock
          # resolved against 3.24.0); latest stable can break version
          # solving for pinned SDK deps like flutter_localizations.
          flutter-version: 3.24.0
          channel: stable

      - name: Dart analyze + tests
        run: |
          flutter pub get
          # Errors only — infos and warnings are not fatal (same policy as
          # the Tests workflow).
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Libbox.xcframework
        # The script installs sing-box's PINNED gomobile fork itself
        # (make lib_install) — installing upstream gomobile here would
        # shadow it and break the bind step.
        run: |
          chmod +x tool/build_libbox.sh
          ./tool/build_libbox.sh

      - name: Dump libbox bindings (swiftinterface + ObjC headers)
        if: always()
        run: |
          mkdir -p /tmp/libbox-iface
          FW=$(find ios/Frameworks/Libbox.xcframework -name 'Libbox.framework' | head -1)
          echo "framework: $FW"
          find "$FW" -maxdepth 3 | sort | head -40 || true
          find -L ios/Frameworks/Libbox.xcframework -name '*.swiftinterface' -exec cp {} /tmp/libbox-iface/ \; || true
          find -L ios/Frameworks/Libbox.xcframework -path '*Headers/*.h' -exec cp {} /tmp/libbox-iface/ \; || true
          ls -la /tmp/libbox-iface || true
        continue-on-error: true

      - name: Upload libbox interface dump
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libbox-swiftinterface
          path: /tmp/libbox-iface
          if-no-files-found: ignore

      - name: Typecheck extension Swift (full diagnostics)
        if: always()
        continue-on-error: true
        run: |
          FW=$(find ios/Frameworks/Libbox.xcframework -name 'Libbox.framework' | head -1)
          xcrun swiftc -typecheck             -sdk $(xcrun --sdk iphonesimulator --show-sdk-path)             -target arm64-apple-ios13.0-simulator             -F "$(dirname "$FW")"             ios/BlackoutTunnel/PacketTunnelProvider.swift 2>&1 | head -80 || true

      - name: Build iOS (device, no codesign)
        # DEVICE build, not simulator: mobile_scanner's GoogleMLKit pods ship
        # device-only binaries, so the Pods-Runner aggregate cannot link for
        # the simulator (MLImage "built for iOS" error). The device build is
        # also what a real install would use.
        run: flutter build ios --no-codesign --verbose

      - name: Verify tunnel extension product
        run: |
          echo "=== all Runner.app copies ==="
          find build/ios -name "Runner.app" -maxdepth 4
          echo "=== contents of each ==="
          for APP in $(find build/ios -name "Runner.app" -maxdepth 4); do
            echo "--- $APP ---"
            ls "$APP" || true
            find "$APP" -name "*.appex" || true
          done
          # The appex must exist as a built product AND be embedded in at
          # least one Runner.app copy (flutter copies the xcodebuild product
          # to build/ios/iphoneos).
          APPEX=$(find build/ios -name "BlackoutTunnel.appex" | head -1)
          test -n "$APPEX" || { echo "ERROR: BlackoutTunnel.appex was never built"; exit 1; }
          echo "appex built: $APPEX"
          EMBEDDED=$(find build/ios -path "*Runner.app*BlackoutTunnel.appex*" | head -1)
          test -n "$EMBEDDED" || { echo "ERROR: appex exists but is not embedded in any Runner.app"; exit 1; }
          echo "BlackoutTunnel.appex embedded OK: $EMBEDDED"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ~/Library/Developer/Xcode/DerivedData/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
