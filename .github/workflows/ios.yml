name: Build iOS (no codesign)

# iOS is not yet a shippable platform (VPN entitlements need a paid Apple
# Developer account, which we do not have). This workflow is the compile
# gate: it proves the Runner app + BlackoutTunnel extension + libbox
# framework link cleanly on a real Xcode toolchain, headless, on every
# push that touches ios/ or the engine code — so the platform never rots
# while it waits for signing.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - '.github/workflows/ios.yml'
      - 'tool/build_libbox.sh'
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin to the version the repo is developed against (pubspec.lock
          # resolved against 3.24.0); latest stable can break version
          # solving for pinned SDK deps like flutter_localizations.
          flutter-version: 3.24.0
          channel: stable

      - name: Dart analyze + tests
        run: |
          flutter pub get
          # Errors only — infos and warnings are not fatal (same policy as
          # the Tests workflow).
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Libbox.xcframework
        # The script installs sing-box's PINNED gomobile fork itself
        # (make lib_install) — installing upstream gomobile here would
        # shadow it and break the bind step.
        run: |
          chmod +x tool/build_libbox.sh
          ./tool/build_libbox.sh

      - name: Dump libbox bindings (swiftinterface + ObjC headers)
        if: always()
        run: |
          mkdir -p /tmp/libbox-iface
          FW=$(find ios/Frameworks/Libbox.xcframework -name 'Libbox.framework' | head -1)
          echo "framework: $FW"
          find "$FW" -maxdepth 3 | sort | head -40 || true
          find -L ios/Frameworks/Libbox.xcframework -name '*.swiftinterface' -exec cp {} /tmp/libbox-iface/ \; || true
          find -L ios/Frameworks/Libbox.xcframework -path '*Headers/*.h' -exec cp {} /tmp/libbox-iface/ \; || true
          ls -la /tmp/libbox-iface || true
        continue-on-error: true

      - name: Upload libbox interface dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libbox-swiftinterface
          path: /tmp/libbox-iface
          if-no-files-found: ignore

      - name: Generate Flutter iOS artifacts
        run: flutter build ios --simulator --no-codesign --verbose

      - name: Build BlackoutTunnel + Runner (simulator SDK, no codesign)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ~/Library/Developer/Xcode/DerivedData/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
