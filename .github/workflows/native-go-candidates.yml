name: Patched native Go candidate builds
on:
  workflow_dispatch:
  push:
    branches: ['arena/**', main]
    paths:
      - 'tool/build_pinned_go_engines.py'
      - 'tool/compare_go_candidate_replicas.py'
      - 'tool/verify_native_candidate_apk.py'
      - 'tool/tests/test_native_candidate_apk.py'
      - 'tool/audit_native_candidate_download.py'
      - 'tool/tests/test_native_candidate_download.py'
      - 'tool/audit_go_engine_locks.py'
      - 'tool/go_engine_candidates/**'
      - '.github/workflows/native-go-candidates.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tool/build_pinned_go_engines.py'
      - 'tool/compare_go_candidate_replicas.py'
      - 'tool/verify_native_candidate_apk.py'
      - 'tool/tests/test_native_candidate_apk.py'
      - 'tool/audit_native_candidate_download.py'
      - 'tool/tests/test_native_candidate_download.py'
      - 'tool/audit_go_engine_locks.py'
      - 'tool/go_engine_candidates/**'
      - '.github/workflows/native-go-candidates.yml'

permissions:
  contents: read

jobs:
  build:
    name: Clean candidate (${{ matrix.engine }}, replica ${{ matrix.replica }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [tun2socks, singbox]
        replica: [1, 2]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify and extract pinned Go archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go1.27.4.linux-amd64.tar.gz"
          curl --fail --location --retry 3 --max-time 300 --output "$archive" https://go.dev/dl/go1.27.4.linux-amd64.tar.gz
          echo "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/verified-go"
          tar -xzf "$archive" -C "$RUNNER_TEMP/verified-go"
          echo "$RUNNER_TEMP/verified-go/go/bin" >> "$GITHUB_PATH"
      - name: Install pinned Android NDK revision
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - name: Build patched snapshots in fresh module and compiler caches
        run: |
          python tool/build_pinned_go_engines.py --engine "$ENGINE" --patched --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output ".cache/patched-$ENGINE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-go-${{ matrix.engine }}-${{ matrix.replica }}
          path: .cache/patched-${{ matrix.engine }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Independent candidate byte comparison
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: native-go-*
          path: .cache/replicas
      - name: Verify provenance and compare binary bytes
        run: |
          python tool/compare_go_candidate_replicas.py --root .cache/replicas > replica-comparison.json
          cat replica-comparison.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: replica-comparison
          path: replica-comparison.json
          if-no-files-found: error
          retention-days: 14


  package:
    name: Isolated native candidate APK packaging
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: native-go-*
          path: .cache/replicas
      - name: Verify baseline and stage candidates in this disposable checkout
        run: |
          python tool/verify_supply_chain.py
          python tool/verify_native_candidate_apk.py --replicas .cache/replicas --stage
      - name: Build isolated debug package
        run: |
          flutter pub get --enforce-lockfile
          (cd android && bash ./gradlew --no-daemon -PnativeTestPackage=true -Ptarget-platform=android-arm,android-arm64 :app:assembleDebug)
      - name: Verify candidate package, signature and exact engine bytes
        run: |
          set -euo pipefail
          apk=build/app/outputs/apk/debug/app-debug.apk
          mkdir -p .cache/native-candidate-apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
          python tool/verify_native_candidate_apk.py --replicas .cache/replicas --apk "$apk" --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" > .cache/native-candidate-apk/packaging.json
          cp "$apk" .cache/native-candidate-apk/standalone-candidates-debug.apk
          (cd .cache/native-candidate-apk && sha256sum standalone-candidates-debug.apk > SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: standalone-candidates-debug-apk
          path: .cache/native-candidate-apk/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Independent downloaded APK audit
    needs: [compare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: replica-comparison
          path: .cache/downloaded-comparison
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: standalone-candidates-debug-apk
          path: .cache/downloaded-apk
      - name: Independently verify the downloaded artifact
        run: |
          set -euo pipefail
          python tool/audit_native_candidate_download.py \
            --folder .cache/downloaded-apk \
            --comparison .cache/downloaded-comparison/replica-comparison.json \
            --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner" > native-apk-audit.json
          cat native-apk-audit.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: independent-native-apk-audit
          path: native-apk-audit.json
          if-no-files-found: error
          retention-days: 14
