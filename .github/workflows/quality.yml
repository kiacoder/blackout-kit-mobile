name: Code quality
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell syntax and correctness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tracked shell scripts
        run: bash tool/check_shell_quality.sh

  kotlin:
    name: Kotlin static analysis and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run pinned Kotlin quality tools on migrated files
        run: python tool/check_kotlin_quality.py

  python:
    name: Python correctness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes --no-deps -r tool/requirements-quality.txt
      - run: python -m ruff check tool
      - run: python -m compileall -q tool

  rust:
    name: Rust Clippy and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt
      - run: cargo clippy --locked --all-targets
        working-directory: native/blackout-core
      - run: cargo test --locked
        working-directory: native/blackout-core
      - name: Check formatting of migrated native files
        run: |
          rustfmt --edition 2021 --check --config skip_children=true \
            native/blackout-core/src/ffi.rs \
            native/blackout-core/src/jni.rs \
            native/blackout-core/src/lib.rs \
            native/blackout-core/src/netstack/device.rs \
            native/blackout-core/src/netstack/mod.rs \
            native/blackout-core/src/netstack/packet.rs \
            native/blackout-core/src/netstack/tests.rs
