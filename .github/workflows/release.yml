name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # The release body is the changelog section for THIS version, not the
      # whole file. `bodyFile: CHANGELOG.md` published every historical entry
      # on every release page, which buried the notes that matter.
      - name: Extract release notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.version }}"
          # Changelog headings carry the version without the tag's leading 'v'.
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog section found for $VERSION - falling back to a pointer."
            printf 'See CHANGELOG.md for the full history. Release %s.\n' "$TAG" > release_notes.md
          fi
          echo "--- release notes ---"
          cat release_notes.md

      - name: Resolve release title
        id: title
        run: |
          TAG="${{ steps.version.outputs.version }}"
          TITLE="$TAG"
          if [ -s release_notes.md ]; then
            # First bold item of the version's first bullet, e.g. "**QR scanner ...** — text"
            SUMMARY="$(grep -m1 -oE '^[[:space:]]*[-*][[:space:]]*\*\*[^*]+\*\*' release_notes.md | sed -E 's/^[[:space:]]*[-*][[:space:]]*\*\*([^*]+)\*\*/\1/')"
            [ -n "$SUMMARY" ] && TITLE="$TAG — $SUMMARY"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.title.outputs.title }}
          bodyFile: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}

  # build_apk was removed on 2026-10-07.
  #
  # It duplicated build.yml exactly: same runner, same Java/Flutter setup, same
  # `flutter build apk --release --split-per-abi`, same two files uploaded with
  # softprops/action-gh-release. Both workflows fire on the same tag push, so
  # two jobs raced to upload identically-named assets to the same release.
  #
  # APK production now lives in exactly one place — build.yml — which also
  # supports workflow_dispatch. This file only creates the release object.

  # build_ios was removed on 2026-09-19.
  #
  # It ran `flutter build ios --release --no-codesign`, wrapped Runner.app into
  # an unsigned .ipa and attached it to the GitHub release. The iOS native layer
  # does not exist — ios/Runner/*.swift are unregistered mocks and there is no
  # AppDelegate.swift — so the job published an installable artifact that cannot
  # establish a tunnel. Shipping it is worse than shipping nothing.
  #
  # Restore this job once NEVPNManager / NEPacketTunnelProvider is implemented
  # and the build is verified on a device.
