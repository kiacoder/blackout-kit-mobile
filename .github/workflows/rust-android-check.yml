name: Rust Android Check

on:
  push:
    branches:
      - 'ci/validate-*'
    # The Rust core (netstack + protocol dialers) also gets its host test
    # suite + Android cross-build on every release tag.
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, commit-pinned (CodeQL: non-immutable action)
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Run host Rust tests
        working-directory: native/blackout-core
        run: cargo test

      - name: Build Android Rust libraries
        working-directory: native/blackout-core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a build --release
