name: Rust Android Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Run host Rust tests
        working-directory: native/blackout-core
        run: cargo test

      - name: Build Android Rust libraries
        working-directory: native/blackout-core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a build --release
