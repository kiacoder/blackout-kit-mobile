name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    # Full unit suite also runs for release tags, in parallel with the
    # release build (which gates on the same tests).
    tags: ['v*']
  pull_request:
    branches: [main, develop]

# Least privilege: this workflow only reads the repo (checkout) and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Verify checked-in binary inventory and action pins
        run: python3 tool/verify_supply_chain.py

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Match the reviewed lockfile and build.yml (Flutter 3.24.0).
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        # All analyzer diagnostics are now fatal.
        run: flutter analyze

      - name: Run unit tests
        # --coverage is what produces coverage/lcov.info. Without it the Codecov
        # step below uploaded a file that was never generated.
        run: flutter test test/ --coverage

      - name: Run Android app unit tests
        # Native lifecycle/config tests live under android/app/src/test and are
        # not executed by flutter test. Keep them as a hard PR gate.
        working-directory: android
        run: bash ../tool/run_gradle_ci.sh :app:testDebugUnitTest

      - name: Run Android lint
        # Fail on lint errors; warning remediation is tracked independently.
        working-directory: android
        run: |
          status=0
          bash ./gradlew --no-daemon :app:lintDebug || status=$?
          if [ "$status" -ne 0 ]; then
            report=../build/app/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            if [ -f "$report" ]; then
              cat "$report"
            fi
          fi
          exit "$status"

      - name: Upload Android lint diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-lint-diagnostics
          path: |
            build/app/reports/lint-results-debug.*
            build/app/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Run integration tests
        # UNVERIFIED. These drive `app.main()`, which calls Hive.initFlutter()
        # and reaches platform channels that do not exist in the flutter_tester
        # environment, so they most likely need a real device or emulator
        # (`flutter test integration_test/ -d <device>`). They also pass against
        # mocked channels, so a green run would not prove the tunnel works.
        # Non-fatal until someone confirms the correct invocation.
        continue-on-error: true
        run: flutter test integration_test/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
