name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # >= 3.24.0, matching pubspec.lock (`dart ">=3.5.0 <4.0.0"`,
          # `flutter ">=3.24.0"`) and build.yml. The tests happened to pass on
          # 3.22.0 only because shared_preferences_android is Android-only and
          # is never compiled by `flutter test` on the host.
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        # Errors only — infos and warnings are not fatal.
        #
        # This is the only static check the project gets. `dart analyze` cannot
        # run on the dev machine (the Dart VM there cannot spawn child
        # processes), and the unit tests below only import models and services,
        # never screens or controllers — so a syntax or type error anywhere in
        # lib/ used to go completely unchecked until a release build failed.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests
        # --coverage is what produces coverage/lcov.info. Without it the Codecov
        # step below uploaded a file that was never generated.
        run: flutter test test/ --coverage

      - name: Run integration tests
        # UNVERIFIED. These drive `app.main()`, which calls Hive.initFlutter()
        # and reaches platform channels that do not exist in the flutter_tester
        # environment, so they most likely need a real device or emulator
        # (`flutter test integration_test/ -d <device>`). They also pass against
        # mocked channels, so a green run would not prove the tunnel works.
        # Non-fatal until someone confirms the correct invocation.
        continue-on-error: true
        run: flutter test integration_test/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
