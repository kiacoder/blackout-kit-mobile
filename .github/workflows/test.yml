name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    # Full unit suite also runs for release tags, in parallel with the
    # release build (which gates on the same tests).
    tags: ['v*']
  pull_request:
    branches: [main, develop]

# Least privilege: this workflow only reads the repo (checkout) and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify checked-in binary inventory and action pins
        run: python3 tool/verify_supply_chain.py

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # >= 3.24.0, matching pubspec.lock (`dart ">=3.5.0 <4.0.0"`,
          # `flutter ">=3.24.0"`) and build.yml. The tests happened to pass on
          # 3.22.0 only because shared_preferences_android is Android-only and
          # is never compiled by `flutter test` on the host.
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        # Errors and warnings are fatal. Existing informational lint debt
        # remains visible and is tracked in docs/PROJECT_ASCENSION.md.
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        # --coverage is what produces coverage/lcov.info. Without it the Codecov
        # step below uploaded a file that was never generated.
        run: flutter test test/ --coverage

      - name: Run Android app unit tests
        # Native lifecycle/config tests live under android/app/src/test and are
        # not executed by flutter test. Keep them as a hard PR gate.
        working-directory: android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        # Fail on lint errors; warning remediation is tracked independently.
        working-directory: android
        run: bash ./gradlew --no-daemon :app:lintDebug

      - name: Run integration tests
        # UNVERIFIED. These drive `app.main()`, which calls Hive.initFlutter()
        # and reaches platform channels that do not exist in the flutter_tester
        # environment, so they most likely need a real device or emulator
        # (`flutter test integration_test/ -d <device>`). They also pass against
        # mocked channels, so a green run would not prove the tunnel works.
        # Non-fatal until someone confirms the correct invocation.
        continue-on-error: true
        run: flutter test integration_test/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
