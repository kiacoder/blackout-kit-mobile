plugins {
    id "com.android.application"
    // The short `kotlin-android` alias resolves to the Kotlin plugin bundled
    // with Flutter (1.6.x), whose metadata reader rejects every modern
    // AndroidX/dependency jar ("compiled with an incompatible version of
    // Kotlin ... expected 1.6.0"). Applying the canonical id uses the version
    // pinned in android/settings.gradle instead.
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Real release signing, driven by android/key.properties when present.
// Falls back to the debug key so local release builds still work.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}

// App version comes from pubspec.yaml, NOT from `flutter.versionCode` /
// `flutter.versionName`. Two independent reasons:
//
// 1. Those are not stable across Flutter versions. In Flutter 3.22.0 (what CI
//    pins) FlutterExtension declares them as *methods* — versionCode() /
//    versionName() — so the Groovy property access `flutter.versionCode` fails
//    configuration with "Could not get unknown property 'versionCode' for
//    extension 'flutter'". Flutter 3.24.0 (the dev machine) turned them into
//    getVersionCode()/getVersionName(), which is why the same file builds fine
//    locally and failed every tagged build on CI.
//
// 2. Even with the right syntax the value is read from `local.properties`,
//    falling back to "1" / "1.0". That file is gitignored and absent on the
//    runner, so a green CI build would still have shipped versionCode 1.
//
// pubspec.yaml is tracked and is the single source of truth, so both machines
// agree. "1.0.0-beta.4+4" -> versionName "1.0.0-beta.4", versionCode 4.
def pubspecVersion = {
    def pubspecFile = rootProject.file("../pubspec.yaml")
    def matcher = pubspecFile.text =~ /(?m)^version:\s*(\S+)/
    if (!matcher.find()) {
        throw new GradleException("No 'version:' line found in ../pubspec.yaml")
    }
    return matcher.group(1)
}()
def versionParts = pubspecVersion.tokenize('+')
def flutterVersionName = versionParts[0]
def flutterVersionCode = versionParts.size() > 1 ? versionParts[1] : '1'

android {
    // Builds libfdlauncher.so, the fork+dup2+exec helper that can pass the
    // VPN's TUN file descriptor to a subprocess (Java's ProcessBuilder
    // cannot - it can only map descriptors 0/1/2, and the Binder-installed
    // tun fd has FD_CLOEXEC set, so the child never sees it).
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    namespace = "com.blackoutkit.vpn"
    buildFeatures {
        buildConfig = true
    }
    compileSdkVersion 34

    lint {
        lintConfig = file("lint.xml")
        warningsAsErrors = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.blackoutkit.vpn"
        if (project.findProperty("enableProcessGuardExperiment") == "true") {
            testInstrumentationRunner "com.blackoutkit.vpn.ProcessGuardAcceptance"
        } else if (project.findProperty("enableOpenVpnCandidate") == "true") {
            testInstrumentationRunner "com.blackoutkit.vpn.OpenVpnCandidateAcceptance"
        }
        buildConfigField "boolean", "ENABLE_EXPERIMENTAL_OPENVPN",
                (project.findProperty("enableOpenVpnCandidate") == "true").toString()
        // Opt-in development adapter, NOT a shipped/verified engine. No binary
        // is downloaded at runtime. Supply reviewed GPL-compliant artifacts.
        buildConfigField "boolean", "ENABLE_EXPERIMENTAL_MIHOMO",
                (project.findProperty("enableMihomo") == "true").toString()
        // Private integration only: disabled until Android acceptance tests pass.
        buildConfigField "boolean", "ENABLE_EXPERIMENTAL_NATIVE_TUNNELS",
                (project.findProperty("enableNativeTunnels") == "true").toString()
        // Raised from 21: libv2ray.aar declares minSdkVersion 24, and the
        // manifest merger hard-fails when the app asks for a lower one.
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // The fd launcher is built for the same two ABIs the app ships (the
        // x86/x86_64 AAR libs are stripped in packagingOptions), and CMake is
        // invoked by Gradle during the Flutter build.
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
            }
        }

        // NOTE: deliberately no `ndk.abiFilters` here. AGP rejects it outright
        // when ABI splits are requested — "Conflicting configuration :
        // 'armeabi-v7a,arm64-v8a' in ndk abiFilters cannot be present when
        // splits abi filters are set" — which made
        // `flutter build apk --split-per-abi` fail completely.
        //
        // The emulator-only x86/x86_64 libs from the AAR are stripped in
        // `packagingOptions` below, which is sufficient on its own: a plain
        // `flutter build apk --release` yields a 109.8 MB fat APK containing
        // only arm64-v8a and armeabi-v7a. Passing
        // `--target-platform android-arm,android-arm64` additionally stops
        // Flutter from compiling x86 Flutter libs that would be discarded.
    }

    if (hasReleaseKey) {
        signingConfigs {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    // Development artifacts live outside tracked jniLibs and only enter debug.
    if (project.findProperty("enableNativeTunnels") == "true") {
        def nativeDir = rootProject.file("../.cache/native-tunnel-jni")
        ["arm64-v8a", "armeabi-v7a"].each { abi ->
            if (!new File(nativeDir, "${abi}/libblackout-tunnels.so").isFile()) {
                throw new GradleException("Missing staged combined native tunnel library; run tool/stage_native_tunnels.py")
            }
            ["awg", "wireguard"].each { legacy ->
                if (new File(nativeDir, "${abi}/libblackout-${legacy}.so").exists()) {
                    throw new GradleException("Refusing stale dual-Go-runtime native tunnel staging")
                }
            }
        }
        sourceSets.debug.jniLibs.srcDir nativeDir
    }
    if (project.findProperty("enableMihomo") == "true") {
        def mihomoDir = rootProject.file("../.cache/mihomo-jni")
        ["arm64-v8a", "armeabi-v7a"].each { abi ->
            if (!new File(mihomoDir, "${abi}/libmihomo.so").isFile()) {
                throw new GradleException("Missing reviewed Mihomo candidate for " + abi)
            }
        }
        sourceSets.debug.jniLibs.srcDir mihomoDir
    }
    if (project.findProperty("enableOpenVpnEmulator") == "true") {
        if (project.findProperty("enableOpenVpnCandidate") != "true" ||
                project.findProperty("target-platform") != "android-x64" ||
                !gradle.startParameter.taskNames.every { it.tokenize(":").last() in ["assembleDebug", "assembleDebugAndroidTest", "testDebugUnitTest"] }) {
            throw new GradleException("OpenVPN emulator requires an isolated x86-64 debug APK")
        }
    }
    if (project.findProperty("enableOpenVpnCandidate") == "true") {
        ["enableProcessGuardExperiment", "enableMihomo", "nativeTestPackage", "enableNativeTunnels"].each { flag ->
            if (project.findProperty(flag) == "true") {
                throw new GradleException("OpenVPN candidate requires an isolated test build")
            }
        }
        def emulator = project.findProperty("enableOpenVpnEmulator") == "true"
        def openVpnDir = rootProject.file(emulator ? "../.cache/openvpn3-emulator-jni" : "../.cache/openvpn3-jni")
        (emulator ? ["x86_64"] : ["arm64-v8a", "armeabi-v7a"]).each { abi ->
            if (!new File(openVpnDir, "${abi}/libopenvpn-candidate.so").isFile()) {
                throw new GradleException("Missing staged OpenVPN candidate for " + abi)
            }
        }
        sourceSets.debug.jniLibs.srcDir openVpnDir
    }
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DBLACKOUT_PROCESS_GUARD_EXPERIMENT=" +
                            (project.findProperty("enableProcessGuardExperiment") == "true" ? "ON" : "OFF")
                }
            }
            // Explicit test-distribution mode: install beside the production app
            // instead of replacing a release-signed com.blackoutkit.vpn build.
            if (project.findProperty("enableProcessGuardExperiment") == "true") {
                applicationIdSuffix ".guardtest"
                versionNameSuffix "-guard-test"
            } else if (project.findProperty("enableOpenVpnCandidate") == "true") {
                applicationIdSuffix ".openvpntest"
                versionNameSuffix "-openvpn-test.1"
            } else if (project.findProperty("enableMihomo") == "true") {
                applicationIdSuffix ".mihomotest"
                versionNameSuffix "-mihomo-test.1"
            } else if (project.findProperty("nativeTestPackage") == "true") {
                applicationIdSuffix ".nativetest"
                versionNameSuffix "-native-test.7"
            }
        }
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DBLACKOUT_PROCESS_GUARD_EXPERIMENT=OFF"
                }
            }
            // Never enable an unverified tunnel in a distribution build.
            buildConfigField "boolean", "ENABLE_EXPERIMENTAL_NATIVE_TUNNELS", "false"
            buildConfigField "boolean", "ENABLE_EXPERIMENTAL_MIHOMO", "false"
            buildConfigField "boolean", "ENABLE_EXPERIMENTAL_OPENVPN", "false"
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    packagingOptions {
        // Extract native libs to disk at install time. WITHOUT this, AGP keeps
        // libsingbox.so / libtun2socks.so inside the APK (extractNativeLibs
        // defaults to false) and nothing ever appears in nativeLibraryDir -
        // which made VpnPlugin report singboxAvailable=false and made
        // EngineRunner refuse every Hysteria2 / TUIC / AmneziaWG config with
        // "needs an engine that is not bundled in this build". sing-box and
        // tun2socks run as subprocesses and need a real file to exec.
        //
        // libv2ray.aar ships libgojni.so for four ABIs at ~35 MB each. Shipping
        // all four took the debug APK to 354 MB. x86 and x86_64 are emulator-only,
        // so arm64-v8a + armeabi-v7a cover every real device.
        //
        // `packagingOptions` DOES apply to native libs — unlike assets, which it
        // silently ignores (see the androidResources note below).
        //
        // arm64-v8a + armeabi-v7a cover every real Android device in use. The
        // x86/x86_64 copies are emulator-only and are dead weight in a shipped
        // APK. If you ever need them back, delete the two `exclude` lines below.
        // Extract to nativeLibraryDir at install time (see the comment above).
        jniLibs.useLegacyPackaging = true
        if (project.findProperty("enableOpenVpnCandidate") == "true") {
            jniLibs.keepDebugSymbols += ["**/libopenvpn-candidate.so"]
        }
        if (project.findProperty("enableMihomo") == "true") {
            jniLibs.keepDebugSymbols += ["**/libmihomo.so"]
        }
        // Exact candidate byte comparison in the isolated native test APK.
        if (project.findProperty("nativeTestPackage") == "true") {
            jniLibs.keepDebugSymbols += ["**/libsingbox.so", "**/libtun2socks.so"]
        }

        exclude 'lib/x86/**'
        if (project.findProperty("enableOpenVpnEmulator") == "true") {
            exclude 'lib/arm64-v8a/**'
            exclude 'lib/armeabi-v7a/**'
        } else {
            exclude 'lib/x86_64/**'
        }
    }

    // libv2ray.aar carries Xray's geoip/geosite databases. Measured effect of
    // dropping them:
    //   uncompressed  147.4 MB -> 119.2 MB  (-28.2 MB)
    //   release APK   123.2 MB -> 115.7 MB  ( -7.5 MB on disk)
    // The .dat files compress ~3.8:1, so the real on-disk saving is 7.5 MB, not
    // the 28 MB the raw sizes suggest.
    //
    // Nothing in this app references them: XrayConfigBuilder emits literal CIDRs
    // and explicit domain lists, never `geoip:`/`geosite:` tags, so the data is
    // never read.
    //
    // NOTE: `packagingOptions.exclude` does NOT filter assets — it only covers
    // JAR resources and native libs. An earlier attempt used it and the data
    // stayed in the APK while the build still reported success. Assets are
    // filtered here, by the resource merger's ignore pattern.
    //
    // The default pattern is repeated because setting this property replaces it.
    //
    // XrayEngine still calls Seq.setContext() so the Go asset reader keeps its
    // APK-asset fallback wired up; it simply has nothing to fall back to.
    //
    // To revert: drop the three geoip/geosite entries and re-add ~7.5 MB on
    // disk. Do that when country-based routing is added to
    // lib/services/xray_config.dart.
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:' +
                '!CVS:!thumbs.db:!picasa.ini:!*~:' +
                '!geoip.dat:!geosite.dat:!geoip-only-cn-private.dat'
    }
}

flutter {
    source = "../.."
}

dependencies {
    testImplementation "junit:junit:4.13.2"

    // IntentCompat.getParcelableExtra — the non-deprecated EXTRA_STREAM read
    // used by the share/Open-with import path (CodeQL #21).
    implementation "androidx.core:core-ktx:1.13.1"

    // Xray core as an Android library (2dust/AndroidLibXrayLite, LGPL-3.0).
    // The AAR ships libgojni.so for all four ABIs plus the geoip/geosite
    // databases (excluded above), and exposes
    // libv2ray.CoreController.startLoop(config, tunFd).
    implementation fileTree(dir: "libs", include: ["*.aar", "*.jar"])
}
