# NOTE: do not put org.gradle.java.home here. This file is tracked in git and
# Gradle reads it on every machine, including CI. A Windows-only path here
# breaks ubuntu-latest runners with "Java home supplied is invalid".
# Gradle falls back to JAVA_HOME, which is what both CI and dev machines use.
org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.enableJetifier=true
