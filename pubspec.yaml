name: blackout_kit_mobile
description: Trustworthy VPN alternative for Iranian users. Config-based, open-source, no backend exposure.
publish_to: none

version: 1.19.4+2064

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.0

  yaml: 3.1.4 # Already locked transitively; full Mihomo document import

  # Config Parsing (future: add specific packages for WG/OpenVPN/SS)
  # For now: pure Dart parsing

  # UI & Animation
  cupertino_icons: ^1.0.2
  flutter_animate: ^4.2.0
  flutter_svg: ^2.0.5
  qr_flutter: ^4.1.0      # QR Code Generation for config sharing
  file_picker: 8.1.7     # Import .conf / .ovpn / config files
  mobile_scanner: ^4.0.1  # QR Code camera scanning

  # Platform Channels
  # NOTE: the native tunnel lives in android/app/src/main/kotlin/com/blackoutkit/vpn/
  # and is reached over MethodChannel. Do not add flutter_vpn here: it is a
  # strongSwan IKEv2/IPSec wrapper and cannot carry WireGuard, OpenVPN or V2Ray.

  # Utilities
  ffi: 2.1.3
  path_provider: 2.1.5
  package_info_plus: 8.3.1
  crypto: ^3.0.2  # For config hashing
  logger: ^2.0.1  # Better logging
  intl: ^0.19.0
  # Material/Cupertino localizations, so Arabic (and the other
  # right-to-left languages) get real RTL layout instead of LTR widgets
  # with translated strings.
  # Keystore/Keychain-backed storage for the config-vault key, so the AES
  # key that encrypts the saved configs is itself protected by the platform.
  flutter_secure_storage: ^9.0.0
  flutter_localizations:
    sdk: flutter
  wakelock_plus: 1.3.2  # Keep screen awake during config testing / active session

dev_dependencies:
  cryptography: 2.9.0 # Isolated authenticated vault experiment
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0

  # Testing
  mockito: ^5.4.0
  test: ^1.24.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/licenses/native_tunnel_licenses.txt
